{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container text-center">
    <h1 class="my-5">My profile</h1>

    <div class="card profile-card">
        <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-center align-items-center">
                <p class="h4 my-3">{{ user.username }}</p>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span><strong>Name shown:</strong> {{ user.profile.display_name }}</span>
                <a class="btn btn-dark ms-3" href="">Change</a>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span class="text-break"><strong>Email:</strong> {{ user.email }}</span>
                <a class="btn btn-dark ms-3" href="">Change</a>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span><strong>Password:</strong> ********</span>
                <a class="btn btn-dark ms-3" href="">Change</a>
            </li>
        </ul>
    </div>
    <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
        <a class="btn btn-dark" href="">Saved recipes</a>
    <a class="btn btn-dark" href="">Shopping list</a>
    </div>
</div>
{% endblock %}
